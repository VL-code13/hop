{% extends 'base.html' %}
{% load static %}

{% block title %}Пароль сохранён | Hop &amp; Barley{% endblock %}

{% block content %}
<div class="auth-page-wrapper" style="min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 40px 15px;">
    <div class="auth-card" style="width: 100%; max-width: 440px; background: #241c16; border: 1px solid #3d3228; border-radius: 8px; padding: 32px 28px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4);">
        <h1 style="color: #75d98d; font-size: 22px; font-weight: 700; margin-bottom: 12px;">Пароль успешно обновлён!</h1>
        <p style="color: #a89f91; font-size: 14px; line-height: 1.5; margin-bottom: 24px;">Аккаунт активирован, вся история ваших предыдущих заказов сохранена в профиле.</p>
        <a href="{% url 'users:login' %}" class="button button--primary" style="display: inline-block; padding: 10px 20px; text-decoration: none;">Войти в личный кабинет</a>
    </div>
</div>
{% endblock %}
