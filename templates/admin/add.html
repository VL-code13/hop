{% extends 'base.html' %}
{% load static %}

{% block title %}Добавить товар | Hop &amp; Barley{% endblock %}

{% block content %}
<main class="admin-page-wrapper" style="padding: 40px 15px;">
  <div class="container" style="max-width: 800px; margin: 0 auto;">
    <div style="margin-bottom: 20px;">
      <a href="{% url 'custom_admin:products_product_changelist' %}" style="color: #e8a84c; text-decoration: none; font-size: 14px;">
        <i class="fa-solid fa-arrow-left"></i> Вернуться к списку товаров
      </a>
    </div>

    <div style="background: #241c16; border: 1px solid #3d3228; border-radius: 8px; padding: 32px;">
      <h1 style="color: #f5f0eb; font-size: 22px; font-weight: 700; margin-bottom: 24px;">Создание карточки товара</h1>

      <form method="post" enctype="multipart/form-data" action="{% url 'custom_admin:products_product_add' %}">
        {% csrf_token %}

        <div class="form-group" style="margin-bottom: 18px;">
          <label style="display: block; color: #d6cebf; font-size: 13px; margin-bottom: 6px;">Название товара</label>
          <input type="text" name="name" class="Input" style="width: 100%; box-sizing: border-box;" placeholder="Например, Хмель Citra (100г)" required>
        </div>

        <div class="form-group" style="margin-bottom: 18px;">
          <label style="display: block; color: #d6cebf; font-size: 13px; margin-bottom: 6px;">Slug (URL-идентификатор)</label>
          <input type="text" name="slug" class="Input" style="width: 100%; box-sizing: border-box;" placeholder="citra-hops-100g" required>
        </div>

        <div class="form-group" style="margin-bottom: 18px;">
          <label style="display: block; color: #d6cebf; font-size: 13px; margin-bottom: 6px;">Описание</label>
          <textarea name="description" class="Textarea" rows="4" style="width: 100%; box-sizing: border-box;" placeholder="Подробное описание характеристик, аромата или назначения..."></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px;">
          <div class="form-group">
            <label style="display: block; color: #d6cebf; font-size: 13px; margin-bottom: 6px;">Цена (₽)</label>
            <input type="number" step="0.01" name="price" class="Input" style="width: 100%; box-sizing: border-box;" placeholder="550.00" required>
          </div>

          <div class="form-group">
            <label style="display: block; color: #d6cebf; font-size: 13px; margin-bottom: 6px;">Количество на складе</label>
            <input type="number" name="stock" class="Input" style="width: 100%; box-sizing: border-box;" value="10" required>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label style="display: block; color: #d6cebf; font-size: 13px; margin-bottom: 6px;">Изображение товара</label>
          <input type="file" name="image" accept="image/*" style="color: #a89f91; font-size: 13px;">
        </div>

        <div style="display: flex; gap: 12px;">
          <button type="submit" class="button button--primary" style="padding: 10px 24px; cursor: pointer;">
            Сохранить товар
          </button>
          <a href="{% url 'custom_admin:products_product_changelist' %}" class="button button--secondary" style="padding: 10px 24px; text-decoration: none;">
            Отмена
          </a>
        </div>
      </form>
    </div>
  </div>
</main>
{% endblock %}
