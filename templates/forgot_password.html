{% extends "base.html" %}
{% load static %}

{% block title %}Восстановление пароля | Hop &amp; Barley{% endblock %}

{% block content %}
<main class="auth-page-wrapper">
  <div class="auth-background">
    <img src="{% static 'img/background/pattern.jpg' %}" alt="Фоновый паттерн">
  </div>
  <div class="auth-form-container">
    <div class="auth-container auth-container--forgot-password">
      <div class="Legend" style="margin-bottom: 20px; text-align: center;">
        <h1 class="auth-title" style="color: #f5f0eb; font-size: 24px;">Сброс пароля</h1>
        <p style="color: #a89f91; font-size: 13px; margin-top: 6px;">Введите email, указанный при регистрации, и мы отправим ссылку для восстановления доступа.</p>
      </div>

      <form class="auth-form" id="forgot-password-form" method="post">
        {% csrf_token %}
        <div class="InputField">
          <label for="id_email">Электронная почта</label>
          <input type="email" id="id_email" name="email" class="Input" placeholder="name@domain.com" required>
        </div>

        <div class="ButtonGroup ButtonGroup--center" style="display: flex; gap: 10px; margin-top: 20px;">
          <a href="{% url 'users:login' %}" class="button button--secondary" style="flex: 1; text-align: center; padding: 10px;">Отмена</a>
          <button type="submit" class="button button--primary" style="flex: 1; padding: 10px;">Сбросить пароль</button>
        </div>
      </form>
    </div>
  </div>
</main>
{% endblock %}
