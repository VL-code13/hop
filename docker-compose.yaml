services:
  db:
    image: postgres:16
    container_name: hop_and_barley_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hopbarley}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p@ssword123}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-hopbarley}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: hop_and_barley_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data: